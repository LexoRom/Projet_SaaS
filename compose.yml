# Nom explicite : Compose ne le déduit pas du dossier, et les volumes sont préfixés « taskflow_ ».
name: taskflow

x-database-env: &database-env
  MONGO_URI: ${MONGO_URI}
  MONGO_DB: ${MONGO_DB}
  MONGO_WRITE_CONCERN: ${MONGO_WRITE_CONCERN}

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    # Le contrôle de santé initialise le replica set au premier démarrage (code 94 :
    # « pas encore initialisé »), puis attend que le nœud soit primaire.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { if (e.code !== 94) throw e;
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          if (!db.hello().isWritablePrimary) quit(1)
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Collections, validateurs, index et données de démonstration. S'exécute puis s'arrête.
  seed:
    image: taskflow-app:1.0
    pull_policy: never
    command: ["node", "src/seed.js"]
    environment:
      <<: *database-env
      SEED_ENABLED: ${SEED_ENABLED}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  app:
    image: taskflow-app:1.0
    build: .
    environment:
      <<: *database-env
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${APP_PORT}:${PORT}"
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$PORT/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
